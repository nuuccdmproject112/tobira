<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> 聯大文創112級畢業專題校外展《扉》開幕邀請函</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">


  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Noto Sans TC', serif;
      background-color: #1a1e24;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
      background-size: 24px 24px;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    /* 邀請函容器：嚴格鎖定 1080 / 3080 縱橫比 */
    .invitation-wrapper {
      position: relative;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1080 / 3080;
      container-type: inline-size;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      overflow: hidden;
      background-color: #ffffff;
    }

    /* 背景底圖 */
    .invitation-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* -------------------------------------------------------------
       各自固定定位區域 (以您調整好的顏色與座標為主)
    ------------------------------------------------------------- */
    
    /* 1. 服務單位 (固定定位在 top: 16.6%) */
    .unit-line-1 {
      position: absolute;
      top: 16.6%;
      left: 16%;
      width: 60%;
      font-size: 2.6cqw;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1;
      z-index: 10;
      pointer-events: none;
    }

    /* 2. 姓名與職稱區域 (固定定位在 top: 18%) */
    .name-title-container {
      position: absolute;
      top: 18%;
      left: 16%;
      width: 60%;
      display: flex;
      align-items: baseline;
      gap: 1.5cqw;
      z-index: 10;
      pointer-events: none;
    }

    /* 姓名獨立 CSS */
    .guest-name-text {
      font-size: 5.2cqw;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.08em;
      white-space: nowrap;
      line-height: 1;
    }

    /* 職務獨立 CSS */
    .guest-title-text {
      font-size: 3.6cqw;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: 0.05em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1;
    }

    /* QR Code 隱形點擊熱區 */
    .hotspot {
      position: absolute;
      border-radius: 8px;
      transition: background-color 0.2s, transform 0.1s;
      cursor: pointer;
      z-index: 20;
    }
    .hotspot:hover {
      background-color: rgba(66, 153, 225, 0.15);
      outline: 2px dashed rgba(66, 153, 225, 0.5);
    }

    /* 角落隱藏按鈕 */
    .stealth-gear-btn {
      opacity: 0.18;
      transition: all 0.3s ease;
    }
    .stealth-gear-btn:hover {
      opacity: 0.95;
      transform: scale(1.1) rotate(30deg);
    }

    /* 《扉》質感開門序幕｜延續邀請函藍白、幾何、黃弧與細紙紋 */
    .tobira-intro{position:fixed;inset:0;z-index:1000;overflow:hidden;box-sizing:border-box;
      display:flex;flex-direction:column;justify-content:center;align-items:center;gap:clamp(12px,2.2vh,22px);
      padding:22px 16px;background:linear-gradient(118deg,#69b0e2 0%,#79bce9 57%,#eef8ff 57.2%,#dbeefa 100%);
      text-align:center;color:#fff;isolation:isolate;transition:opacity .8s ease,visibility .8s ease;}
    .tobira-intro::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.19;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.63' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.36' filter='url(%23n)'/%3E%3C/svg%3E");}
    .tobira-intro::after{content:"";position:absolute;left:-6%;right:-6%;bottom:-12%;height:23%;z-index:-1;
      border-radius:50% 50% 0 0;background:rgba(246,251,255,.34);transform:rotate(-3deg);}
    .tobira-decor{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:-1;}
    .tobira-intro.is-gone{opacity:0;visibility:hidden;pointer-events:none;}
    .tobira-intro-heading{position:relative;z-index:3;animation:tobiraEnter .9s ease both;}
    .tobira-intro-heading .school{font-size:clamp(10px,2vw,13px);letter-spacing:.16em;line-height:1.7;font-weight:600;}
    .tobira-intro-heading .title{margin:9px auto 7px;line-height:1;}
    .tobira-intro-heading .title-logo{display:block;width:clamp(97px,22vw,145px);height:auto;max-height:16vh;object-fit:contain;margin:auto;filter:drop-shadow(0 2px 3px rgba(22,96,153,.08));}
    .tobira-intro-heading .sub{font-size:clamp(13px,2.8vw,17px);letter-spacing:.14em;}
    .tobira-scene{position:relative;z-index:2;width:min(56vw,230px);height:min(71vw,295px);
      min-width:164px;min-height:210px;perspective:1200px;animation:tobiraEnter 1.1s .1s ease both;}
    .tobira-scene::before{content:"";position:absolute;inset:-12px;border:1px solid rgba(255,255,255,.7);pointer-events:none;}
    .tobira-door{position:relative;display:block;width:100%;height:100%;padding:0;border:4px solid rgba(247,251,255,.95);
      background:#d6edf9;box-shadow:0 17px 35px rgba(36,99,151,.22),0 2px 9px rgba(43,112,158,.12);
      cursor:pointer;appearance:none;transform-style:preserve-3d;}
    .tobira-behind{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;
      gap:8px;overflow:hidden;background:#d5effe;pointer-events:none;}
    .tobira-behind::before{content:"";position:absolute;inset:0;background:#e9f5fc;}
    .tobira-behind::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(31,120,185,.08),rgba(241,249,255,.44));}
    
    .tobira-behind small{position:relative;z-index:1;max-width:90%;font-size:11px;letter-spacing:.1em;color:#245f9b;background:rgba(245,252,255,.84);padding:5px 7px;}
    .tobira-leaf{position:absolute;top:0;bottom:0;width:50%;box-sizing:border-box;
      background:linear-gradient(150deg,#8dcaf0 0%,#5da7dc 72%,#4e9bce 100%);
      backface-visibility:hidden;transform-style:preserve-3d;
      transition:transform 1.5s cubic-bezier(.2,.7,.13,1);box-shadow:inset 0 0 0 1px #ffffff66;}
    .tobira-leaf::before{content:"";position:absolute;inset:9px;border:1px solid rgba(255,255,255,.57);}
    .tobira-leaf::after{content:"";position:absolute;top:14%;left:20%;width:72%;height:1px;transform:rotate(-28deg);background:#effaff90;}
    .tobira-left{left:0;transform-origin:left center;border-right:1px solid #c8e6f8;}
    .tobira-right{right:0;transform-origin:right center;border-left:1px solid #c8e6f8;}
    .tobira-handle{position:absolute;top:51%;width:6px;height:23px;border-radius:6px;background:#f7e633;
      box-shadow:0 1px 5px rgba(36,90,134,.16);}
    .tobira-left .tobira-handle{right:6px}.tobira-right .tobira-handle{left:6px}
    .tobira-door.is-opening .tobira-left{transform:rotateY(-118deg)}
    .tobira-door.is-opening .tobira-right{transform:rotateY(118deg)}
    .tobira-instruction{position:relative;z-index:2;font-size:clamp(13px,3vw,16px);
      letter-spacing:.2em;font-weight:600;animation:tobiraEnter 1s .2s both;}
    /* 展覽主題標語：深海軍藍文字與柔和淺色底，保持對比與閱讀性 */
    .tobira-quote{
      position:relative;z-index:2;
      font-family:'Noto Serif TC', 'Songti TC', serif;
      color:#183e60;
      background:rgba(247,251,255,.94);
      border-radius:2px;
      padding:10px 18px;
      max-width:min(90vw,430px);
      font-size:clamp(15px,3.6vw,17px);
      font-weight:500;
      line-height:1.95;
      letter-spacing:.07em;
      text-wrap:balance;
      box-shadow:0 1px 6px rgba(41,103,148,.06);
      animation:tobiraEnter 1s .3s both;
    }
    .tobira-skip{position:relative;z-index:2;border:1px solid rgba(255,255,255,.65);color:#fff;
      background:rgba(51,121,172,.15);padding:9px 18px;border-radius:999px;cursor:pointer;
      font-size:12px;transition:background .2s;animation:tobiraEnter 1s .4s both;}
    .tobira-skip:hover{background:rgba(51,121,172,.38)}
    .tobira-intro.is-revealing .tobira-scene{transform:scale(1.055);transition:transform .6s ease}
    .tobira-door:focus-visible,.tobira-skip:focus-visible{outline:3px solid #fff244;outline-offset:5px}
    @keyframes tobiraEnter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @media(max-height:640px){.tobira-intro{gap:8px;padding:10px 12px}.tobira-scene{min-width:0;min-height:0;width:148px;height:186px}.tobira-intro-heading .title-logo{width:79px}.tobira-quote{font-size:14px;padding:7px 12px;line-height:1.65}}
    @media(prefers-reduced-motion:reduce){.tobira-intro *, .tobira-intro{animation:none!important;transition-duration:.01ms!important;}}
  </style>
</head>
<body class="flex flex-col items-center justify-start py-6 px-3">

  <!-- 《扉》質感開門序幕｜沿用邀請函品牌視覺 -->
  <section id="tobiraIntro" class="tobira-intro" aria-label="開啟扉的專屬邀請函">
    <svg class="tobira-decor" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <path d="M296 -70L374 226L415 222" fill="none" stroke="#8bbfe8" stroke-width="22" opacity=".38"/>
      <!-- 保留右側柔和黃線；刪除三角線條與左下角裝飾 -->
      <path d="M410 347 C379 322 354 311 335 322 C303 341 284 390 289 431 C291 444 294 455 298 465" fill="none" stroke="#f8e839" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="tobira-intro-heading">
      <p class="school">國立聯合大學文化創意與數位行銷學系</p>
      <h1 class="title"><img src="./fei-logo.png" class="title-logo" alt="扉 畢業專題展 LOGO"></h1>
      <p class="sub">112 級畢業專題校外展 · 開幕邀請函</p>
    </div>
    <div class="tobira-scene">
      <button id="tobiraDoor" class="tobira-door" type="button" aria-label="點擊開門，閱讀專屬邀請函">
        <span class="tobira-behind" aria-hidden="true"><small>誠摯邀請您蒞臨</small></span>
        <span class="tobira-leaf tobira-left" aria-hidden="true"><span class="tobira-handle"></span></span>
        <span class="tobira-leaf tobira-right" aria-hidden="true"><span class="tobira-handle"></span></span>
      </button>
    </div>
    <p class="tobira-instruction">輕觸門扉・開啟邀請</p>
    <p class="tobira-quote">每一扇門的背後，都蘊藏著不同的故事與可能。</p>
    <button id="tobiraSkip" class="tobira-skip" type="button">略過動畫，直接閱讀邀請函</button>
  </section>

  <!-- 主體區域：邀請函卡片容器 -->
  <main class="invitation-wrapper my-auto relative">
    
    <!-- 1. 底圖 -->
    <img 
      src="./專籌校外展邀請函.png" 
      alt="112級畢業專題校外展邀請函" 
      class="invitation-img"
      onerror="this.onerror=null; this.src='https://placehold.co/1080x3080/f4f0eb/2c3e50?text=請確認圖片檔名為%0A專籌校外展邀請函.png';"
    >

    <!-- 2. 動態壓圖區塊 (各自獨立定位) -->
    <div id="displayUnit1" class="unit-line-1">國立聯合大學</div>
    
    <!-- 姓名與職稱 --> 
    <div class="name-title-container">
      <span id="displayName" class="guest-name-text">葉峻楷</span>
      <span id="displayTitle" class="guest-title-text">專案負責人</span>
    </div>

    <!-- 3. 下方 QR Code 熱區 -->
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSc3_a7b5GHAKRM-Nk0PbzfdQ0KUmzqb5bqO4djtEOXaWRLnMw/viewform?fbzx=-6724354403247222421" target="_blank" class="hotspot" style="top: 55.2%; left: 65.5%; width: 28%; height: 18.5%;" title="點擊回覆出席"></a>
    <a href="https://maps.app.goo.gl/dZSq9ujjK64RynUaA" target="_blank" class="hotspot" style="top: 89.2%; left: 11.5%; width: 23%; height: 8%;" title="停車場地圖"></a>
    <a href="https://maps.app.goo.gl/k2aBjto8VLSPvFbe6" target="_blank" class="hotspot" style="top: 89.2%; left: 38.5%; width: 23%; height: 8%;" title="停車場地圖"></a>
    <a href="https://maps.app.goo.gl/bSf9BrtiH3aVrUKT7" target="_blank" class="hotspot" style="top: 86.2%; left: 69.5%; width: 20.5%; height: 11%;" title="會場導航"></a>

  </main>

  <!-- 4. 極度隱蔽的右下角工作按鈕 ⚙️ -->
  <div class="fixed bottom-3 right-3 z-50">
    <button onclick="openAdminModal()" class="stealth-gear-btn w-9 h-9 bg-stone-800/80 text-stone-300 rounded-full flex items-center justify-center shadow-lg border border-stone-600/50 backdrop-blur-sm">
      <i class="fa-solid fa-gear text-sm"></i>
    </button>
  </div>

  <!-- 5. 彈出式編輯工作視窗 -->
  <div id="adminModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-250">
    <div class="bg-stone-900 border border-stone-700/80 text-stone-200 rounded-2xl w-full max-w-sm p-5 shadow-2xl relative transform scale-95 transition-transform duration-250" id="modalCard">
      
      <div class="flex items-center justify-between pb-3 border-b border-stone-800 mb-4">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-amber-500 text-sm"></i>
          <h3 class="text-sm font-bold text-stone-100">邀請函網址編輯工作區</h3>
        </div>
        <button onclick="closeAdminModal()" class="text-stone-400 hover:text-white text-xs p-1 rounded-lg hover:bg-stone-800">
          <i class="fa-solid fa-xmark text-base"></i>
        </button>
      </div>

      <!-- 表單輸入區 -->
      <div class="space-y-2.5 text-xs">
        <div>
          <label class="block text-stone-400 mb-1 font-medium">服務單位 (unit / unit1)</label>
          <input type="text" id="inputUnit1" placeholder="例：國立聯合大學" class="w-full bg-stone-800 border border-stone-700 rounded-lg px-3 py-1.5 text-stone-100 focus:outline-none focus:border-amber-500">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-stone-400 mb-1 font-medium">貴賓姓名 (name)</label>
            <input type="text" id="inputName" placeholder="例：葉峻楷" class="w-full bg-stone-800 border border-stone-700 rounded-lg px-3 py-1.5 text-stone-100 focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-stone-400 mb-1 font-medium">正式職稱 (title)</label>
            <input type="text" id="inputTitle" placeholder="例：專案負責人" class="w-full bg-stone-800 border border-stone-700 rounded-lg px-3 py-1.5 text-stone-100 focus:outline-none focus:border-amber-500">
          </div>
        </div>
      </div>

      <!-- 快速測試範例 -->
      <div class="mt-3 pt-2 border-t border-stone-800">
        <span class="text-[10px] text-stone-500 block mb-1">快速套用範例：</span>
        <div class="flex flex-wrap gap-1.5">
          <button onclick="setQuickSample('國立聯合大學文化創意與數位行銷學系', '葉峻楷', '專案負責人')" class="px-2 py-1 bg-stone-800 hover:bg-stone-700 text-stone-300 rounded text-[11px] border border-stone-700">校內單位</button>
          <button onclick="setQuickSample('苗栗縣政府文化觀光局', '張副局長', '閣下')" class="px-2 py-1 bg-stone-800 hover:bg-stone-700 text-stone-300 rounded text-[11px] border border-stone-700">縣府貴賓</button>
          <button onclick="setQuickSample('', '林大衛', '總監')" class="px-2 py-1 bg-stone-800 hover:bg-stone-700 text-stone-300 rounded text-[11px] border border-stone-700">無單位(僅姓名職稱)</button>
        </div>
      </div>

      <!-- 操作按鈕 -->
      <div class="mt-4 flex gap-2 pt-2 border-t border-stone-800">
        <button onclick="applyAndPreview()" class="flex-1 py-2 bg-stone-700 hover:bg-stone-600 text-stone-100 font-medium rounded-lg text-xs flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-eye"></i> 即時預覽
        </button>
        <button onclick="copyInvitationUrl()" class="flex-1 py-2 bg-amber-600 hover:bg-amber-500 text-white font-medium rounded-lg text-xs flex items-center justify-center gap-1.5 shadow-lg shadow-amber-900/40">
          <i class="fa-regular fa-copy"></i> 複製專屬連結
        </button>
      </div>

    </div>
  </div>

  <!-- Toast 通知 -->
  <div id="toast" class="fixed bottom-12 left-1/2 -translate-x-1/2 bg-stone-800 text-amber-400 border border-amber-500/30 text-xs px-4 py-2.5 rounded-full shadow-2xl opacity-0 pointer-events-none flex items-center gap-2 z-50 transition-all duration-300">
    <i class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastMsg">已複製專屬邀請連結！</span>
  </div>

  <script>
    // 讀取網址參數
    function loadGuestInfoFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      
      let unit1 = urlParams.get('unit1') || urlParams.get('unit');
      const name = urlParams.get('name');
      const title = urlParams.get('title');

      const elUnit1 = document.getElementById('displayUnit1');
      const elName = document.getElementById('displayName');
      const elTitle = document.getElementById('displayTitle');

      // 1. 服務單位 (若無則留空)
      if (unit1 && unit1.trim() !== '') {
        elUnit1.textContent = decodeURIComponent(unit1.trim());
      } else {
        elUnit1.textContent = '';
      }

      // 2. 姓名
      if (name && name.trim() !== '') {
        elName.textContent = decodeURIComponent(name.trim());
      } else {
        elName.textContent = '貴賓';
      }

      // 3. 職稱
      if (title && title.trim() !== '') {
        elTitle.textContent = decodeURIComponent(title.trim());
        elTitle.style.display = 'inline';
      } else {
        elTitle.style.display = 'none';
      }

      // 同步填入控制台輸入框
      document.getElementById('inputUnit1').value = unit1 ? decodeURIComponent(unit1) : '';
      document.getElementById('inputName').value = name ? decodeURIComponent(name) : '';
      document.getElementById('inputTitle').value = title ? decodeURIComponent(title) : '';
    }

    // 更新網址與歷史紀錄
    function updateUrlParams(u1, n, t) {
      const currentUrl = new URL(window.location.href);
      currentUrl.searchParams.delete('unit2'); // 確保舊有 unit2 被徹底清除

      if (u1 && u1.trim() !== '') {
        currentUrl.searchParams.set('unit1', u1.trim());
      } else {
        currentUrl.searchParams.delete('unit1');
        currentUrl.searchParams.delete('unit');
      }

      if (n && n.trim() !== '') currentUrl.searchParams.set('name', n.trim());
      else currentUrl.searchParams.delete('name');

      if (t && t.trim() !== '') currentUrl.searchParams.set('title', t.trim());
      else currentUrl.searchParams.delete('title');

      window.history.pushState({}, '', currentUrl);
      loadGuestInfoFromUrl();
    }

    function applyAndPreview() {
      const u1 = document.getElementById('inputUnit1').value;
      const n = document.getElementById('inputName').value;
      const t = document.getElementById('inputTitle').value;
      updateUrlParams(u1, n, t);
      showToast('已更新邀請函預覽！');
    }

    function setQuickSample(u1, n, t) {
      document.getElementById('inputUnit1').value = u1;
      document.getElementById('inputName').value = n;
      document.getElementById('inputTitle').value = t;
      updateUrlParams(u1, n, t);
      showToast(`已套用範例：${n}`);
    }

    function copyInvitationUrl() {
  const u1 = document.getElementById('inputUnit1').value;
  const n = document.getElementById('inputName').value;
  const t = document.getElementById('inputTitle').value;
  
  // 1. 先更新網址參數與頁面預覽
  updateUrlParams(u1, n, t);

  // 2. 將網址經由 decodeURIComponent 解碼回中文
  const rawUrl = window.location.href;
  const chineseUrl = decodeURIComponent(rawUrl);

  // 3. 複製解碼後的中文網址至剪貼簿
  if (navigator.clipboard && window.isSecureContext) {
    // 優先採用現代 Clipboard API
    navigator.clipboard.writeText(chineseUrl).then(() => {
      showToast('已複製中文專屬邀請網址！');
    }).catch(() => {
      fallbackCopyText(chineseUrl);
    });
  } else {
    // 備用複製方案
    fallbackCopyText(chineseUrl);
  }
}

// 備用複製工具函式
function fallbackCopyText(text) {
  const dummy = document.createElement('textarea');
  document.body.appendChild(dummy);
  dummy.value = text;
  dummy.select();
  document.execCommand('copy');
  document.body.removeChild(dummy);
  showToast('已複製中文專屬邀請網址！');
}

    function openAdminModal() {
      const modal = document.getElementById('adminModal');
      const card = document.getElementById('modalCard');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        card.classList.remove('scale-95');
        card.classList.add('scale-100');
      }, 10);
    }

    function closeAdminModal() {
      const modal = document.getElementById('adminModal');
      const card = document.getElementById('modalCard');
      modal.classList.add('opacity-0');
      card.classList.remove('scale-100');
      card.classList.add('scale-95');
      setTimeout(() => { modal.classList.add('hidden'); }, 250);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    window.onload = function () {
      loadGuestInfoFromUrl();
      window.addEventListener('popstate', loadGuestInfoFromUrl);
    };
  </script>

  <script>
    // 僅控制開門動畫；保留既有姓名/單位/職稱、QR 熱區與管理功能
    (function () {
      const intro = document.getElementById('tobiraIntro');
      const door = document.getElementById('tobiraDoor');
      const skip = document.getElementById('tobiraSkip');
      let closing = false;
      function finish() {
        if (closing) return;
        closing = true;
        intro.classList.add('is-gone');
        setTimeout(() => { intro.remove(); }, 700);
      }
      door.addEventListener('click', function () {
        if (door.classList.contains('is-opening')) return;
        door.classList.add('is-opening');
        intro.classList.add('is-revealing');
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        setTimeout(finish, reduce ? 50 : 1650);
      });
      skip.addEventListener('click', finish);
    })();
  </script>
